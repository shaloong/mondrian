[package]
name = "clap-sys"
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT AND (MIT OR Apache-2.0)"
description = "Official CLAP 1.2.10 generated ABI used by Mondrian"
publish = false

# Runtime owns an explicit workspace boundary; generator is a separate tool.
[workspace]
resolver = "3"
exclude = ["generator"]
