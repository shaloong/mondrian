[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "WTFPL",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[advisories]
version = 2
ignore = [
    # Both quick-xml advisories are currently reachable only through build-time
    # XML parsers in xcb and wayland-scanner. Mondrian does not pass project or
    # media input to these parsers. Remove these exceptions as soon as those
    # upstream crates accept quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser 0.25 is unmaintained rather than known vulnerable. It remains
    # the newest version selected by the current fontdb/cosmic-text/resvg and
    # winit stacks. Remove this exception when those upstream stacks migrate.
    "RUSTSEC-2026-0192",
]
