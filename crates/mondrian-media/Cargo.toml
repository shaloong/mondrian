[package]
name        = "mondrian-media"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[features]
default = []
validation = []

[dependencies]
mondrian-storage = { workspace = true }
mondrian-core = { workspace = true }

# FFmpeg bindings link dynamically for source builds. Product packages carry
# their own verified private runtime closure; end users do not install FFmpeg.
ffmpeg-next = "8"

# 音频
cpal    = "0.15"    # 跨平台音频输出
rubato  = "0.15"    # 高质量重采样

# 异步
tokio   = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# 并发
parking_lot    = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }
dashmap        = { workspace = true }

# 错误处理
thiserror  = { workspace = true }
anyhow     = { workspace = true }

# 序列化
serde      = { workspace = true }
serde_json = { workspace = true }

# 日志
tracing    = { workspace = true }

# 文件
walkdir    = { workspace = true }
tempfile   = { workspace = true }

# LRU 缓存
lru = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile  = "3"
