[package]
name = "mondrian-vst3-editor-fixture"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vst3 = { path = "../../../../../vendor/vst3-sdk" }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi", "processthreadsapi"] }

[workspace]
