[package]
name        = "mondrian-ui-text"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mondrian-core       = { workspace = true }
mondrian-ui-core    = { workspace = true }
mondrian-ui-theme   = { workspace = true }
mondrian-ui-renderer = { workspace = true }

cosmic-text = "0.14"
fontdb = { version = "0.23", default-features = false, features = ["fontconfig"] }
