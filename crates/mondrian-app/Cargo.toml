[package]
name        = "mondrian-app"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
rust-version.workspace = true
default-run = "mondrian"

[features]
validation = [
    "mondrian-export/validation",
    "mondrian-media/validation",
    "dep:mondrian-validation-launcher",
    "mondrian-renderer/validation",
    "dep:tiff",
]

# Product app UI editor shell.
[[bin]]
name = "mondrian"
path = "src/main.rs"

[[bin]]
name = "mondrian-golden"
path = "src/bin/mondrian_golden.rs"
required-features = ["validation"]
test = false
bench = false

[[bin]]
name = "mondrian-surface-reopen"
path = "src/bin/mondrian_surface_reopen.rs"
required-features = ["validation"]
test = false
bench = false

[[bin]]
name = "mondrian-endurance"
path = "src/bin/mondrian_endurance.rs"
required-features = ["validation"]
test = false
bench = false

# Developer gallery for reusable app UI widgets.
[[bin]]
name = "ui_demo"
path = "src/bin/ui_demo.rs"

[[bin]]
name = "ui_color_test"
path = "src/bin/ui_color_test.rs"

[[bin]]
name = "ui_widget_test"
path = "src/bin/ui_widget_test.rs"

[[bin]]
name = "ui_pipeline_test"
path = "src/bin/ui_pipeline_test.rs"

[[bin]]
name = "viewer_gpu_output_budget"
path = "src/bin/viewer_gpu_output_budget.rs"

# Production-linked owner protocol without integration-test companion binaries.
[[example]]
name = "performance_owner_protocol"
path = "examples/performance_owner_protocol.rs"
required-features = ["validation"]
test = true
bench = false

# Actual-source protocol tests without integration-test companion binaries.
[[example]]
name = "preview_visual_protocol"
path = "examples/preview_visual_protocol.rs"
required-features = ["validation"]
test = true
harness = true
bench = false

[[example]]
name = "window_service_protocol"
path = "examples/window_service_protocol.rs"
required-features = ["validation"]
test = true
harness = true
bench = false

[[example]]
name = "host_startup_qualification"
path = "examples/host_startup_qualification.rs"
required-features = ["validation"]
test = true
harness = true
bench = false

[[example]]
name = "cross_application_capture"
path = "examples/cross_application_capture.rs"
required-features = ["validation"]
test = false
bench = false

[[example]]
name = "local_media_smoke"
path = "examples/local_media_smoke.rs"
required-features = ["validation"]
test = false
bench = false

[[example]]
name = "local_media_export_smoke"
path = "examples/local_media_export_smoke.rs"
required-features = ["validation"]
test = false
bench = false

[[example]]
name = "local_media_proxy_smoke"
path = "examples/local_media_proxy_smoke.rs"
required-features = ["validation"]
test = false
bench = false

[dependencies]
tiff = { version = "0.11.3", optional = true }
mondrian-validation-launcher = { workspace = true, optional = true }
mondrian-storage  = { workspace = true }
mondrian-core     = { workspace = true }
mondrian-broadcast = { workspace = true }
mondrian-playback = { workspace = true }
mondrian-render-cache = { workspace = true }
mondrian-reference-output = { workspace = true }
mondrian-audio    = { workspace = true }
mondrian-media    = { workspace = true }
mondrian-timeline = { workspace = true }
mondrian-interchange = { workspace = true }
mondrian-renderer = { workspace = true }
mondrian-assets   = { workspace = true }
mondrian-effects  = { workspace = true }
mondrian-export   = { workspace = true }
mondrian-project  = { workspace = true }

# 新 UI 架构
mondrian-editor-state = { workspace = true }
mondrian-ui-core      = { workspace = true }
mondrian-ui-theme     = { workspace = true }
mondrian-platform     = { workspace = true }
mondrian-ui-renderer  = { workspace = true }
mondrian-ui-layout    = { workspace = true }
mondrian-ui-events    = { workspace = true }
mondrian-ui-widgets   = { workspace = true }
mondrian-ui-tooltip   = { workspace = true }
mondrian-ui-text      = { workspace = true }

tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

rfd       = "0.15"
image     = { workspace = true }
usvg      = { workspace = true }
resvg     = { workspace = true }
tiny-skia = "0.11"

# 异步
tokio     = { workspace = true }
# 日志
tracing           = { workspace = true }
# 错误
anyhow    = { workspace = true }
thiserror = { workspace = true }
# 序列化
serde     = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
# 并发
parking_lot = { workspace = true }
glam  = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
winit = "0.30"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
mondrian-editor-state = { workspace = true, features = ["test-support"] }
mondrian-export = { workspace = true, features = ["validation"] }
mondrian-renderer = { workspace = true, features = ["validation"] }
tempfile = { workspace = true }
