name: Dependency Audit

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    name: Periodic dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@b5f481f16e786705c7dde1397a33ca4a65131d62 # cargo-deny
      - name: Check dependencies against current advisories
        run: cargo deny check bans licenses advisories sources
