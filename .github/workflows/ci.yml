name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────
  #  代码质量检查
  # ─────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 FFmpeg 开发库
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: rustfmt 检查
        run: cargo fmt --all -- --check

      - name: clippy 检查
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────
  #  跨平台构建 & 测试
  # ─────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      # Linux：通过 apt 安装 FFmpeg
      - name: 安装 FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev pkg-config

      # macOS：通过 Homebrew 安装 FFmpeg
      - name: 安装 FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      # Windows：使用 vcpkg 安装 FFmpeg
      - name: 安装 FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgGitCommitId: "a42af01b72c28a8e1d7b48107b33e4f286a55ef6"
          runVcpkgInstall: true

      - name: 设置 VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      - name: cargo build
        run: cargo build --workspace --exclude mondrian-app

      - name: cargo test
        run: cargo test --workspace --exclude mondrian-app -- --nocapture

  # ─────────────────────────────────────────────
  #  文档构建
  # ─────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 FFmpeg (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev pkg-config
      - name: cargo doc
        run: cargo doc --workspace --no-deps --exclude mondrian-app
        env:
          RUSTDOCFLAGS: "-D warnings"
