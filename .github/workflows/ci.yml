name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep native dependency resolution reproducible and identical to Release.
  VCPKG_REF: "2026.07.29"

# ─────────────────────────────────────────────────────────────────────────────
# 缓存策略：每个 Job 独立缓存，避免交叉污染并提升命中率
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  reference-contracts:
    name: Reference Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 校验 Reference Corpus 与项目契约
        shell: pwsh
        run: ./scripts/validation/validate-reference-assets.ps1 -Tier Pr

      - name: 校验 GitHub Actions 固定提交
        shell: pwsh
        run: ./scripts/validation/validate-github-actions-pins.ps1

      - name: 校验 Phase owner receipt 合同
        shell: pwsh
        run: ./scripts/validation/test-phase-owner-closure.ps1

      - name: 校验 Windows 参考机资格契约
        shell: pwsh
        run: ./scripts/validation/validate-windows-reference.ps1 -MachineReportPath tests/validation/fixtures/windows-machine-qualified-v3.json -RequiredMemoryClass standard-playback -RequireBaselineEligibility -OutputPath target/validation/reference-machine-contract.json

      - name: 校验 8 GiB 最低支持内存契约
        shell: pwsh
        run: ./scripts/validation/validate-windows-reference.ps1 -MachineReportPath tests/validation/fixtures/windows-machine-minimum-memory-v3.json -RequiredMemoryClass minimum-supported -OutputPath target/validation/minimum-memory-contract.json

  # ───────────────────────────────────────────────────────────────────────────
  # 代码格式 & 风格检查（最快，优先失败）
  # ───────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: 检查格式
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────────────────────────────
  # Clippy 静态分析
  # ───────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev libdbus-1-dev libxcb1-dev pkg-config

      - name: 运行 clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV（最低支持 Rust 版本）验证
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # workspace.rust-version = 1.97
      - name: 安装 Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev libdbus-1-dev libxcb1-dev pkg-config

      - name: 编译 workspace（验证 MSRV 兼容性）
        run: cargo build --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 依赖安全审计（license + advisories）
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: 安装 cargo-deny
        uses: taiki-e/install-action@b5f481f16e786705c7dde1397a33ca4a65131d62 # cargo-deny

      - name: 运行 cargo-deny
        run: cargo deny check bans licenses advisories sources

  # ───────────────────────────────────────────────────────────────────────────
  # 测试（Windows + Linux + macOS；实机硬件资格仍由专用 Windows 门禁负责）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm libx264-dev libx265-dev libaom-dev libdav1d-dev \
            libopenjp2-7-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libass-dev libssl-dev zlib1g-dev \
            libasound2-dev libdbus-1-dev libxcb1-dev pkg-config
          ffmpeg_prefix="$RUNNER_TEMP/mondrian-ffmpeg"
          bash scripts/build-linux-ffmpeg.sh "$RUNNER_TEMP/mondrian-ffmpeg-build" "$ffmpeg_prefix" 2
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=$ffmpeg_prefix/lib${RUSTFLAGS:+ $RUSTFLAGS}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ffmpeg_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # Hosted Linux runners use Mesa software Vulkan for shader correctness.
      # This provider is not evidence of physical GPU or playback qualification.
      - name: Install and verify headless Vulkan test provider (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          install -d -m 700 "$RUNNER_TEMP/mondrian-xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/mondrian-xdg-runtime"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          vulkaninfo --summary

      # ── macOS ─────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config x264 x265 aom dav1d openjpeg freetype harfbuzz fontconfig libass openssl@3 zlib
          brew_prefix="$(brew --prefix)"
          openssl_prefix="$(brew --prefix openssl@3)"
          zlib_prefix="$(brew --prefix zlib)"
          export PKG_CONFIG_PATH="$openssl_prefix/lib/pkgconfig:$zlib_prefix/lib/pkgconfig:$brew_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LDFLAGS="-L$brew_prefix/lib -Wl,-rpath,$brew_prefix/lib -L$openssl_prefix/lib -Wl,-rpath,$openssl_prefix/lib -L$zlib_prefix/lib -Wl,-rpath,$zlib_prefix/lib"
          ffmpeg_prefix="$RUNNER_TEMP/mondrian-ffmpeg"
          bash scripts/build-macos-ffmpeg.sh "$RUNNER_TEMP/mondrian-ffmpeg-build" "$ffmpeg_prefix" 2
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=$ffmpeg_prefix/lib${RUSTFLAGS:+ $RUSTFLAGS}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$ffmpeg_prefix/lib/pkgconfig" pkg-config --modversion libavcodec | grep -E '^62\.'

      # ── Windows ───────────────────────────────────────────────────────────
      - name: 缓存 vcpkg (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ runner.os }}-vcpkg-ffmpeg-runtime-v4-${{ env.VCPKG_REF }}-${{ hashFiles('Cargo.lock', 'vcpkg-overlay/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-runtime-v4-${{ env.VCPKG_REF }}-

      - name: 初始化 vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone --branch $env:VCPKG_REF --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          } else {
            git -C C:\vcpkg fetch --depth 1 origin "refs/tags/$env:VCPKG_REF"
            git -C C:\vcpkg checkout --detach FETCH_HEAD
          }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Activate MSVC x64 and verify static DXC prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/enter-windows-development.ps1 -MsvcOnly
          foreach ($variableName in @('INCLUDE', 'LIB', 'LIBPATH', 'PATH',
              'VCToolsInstallDir', 'VCToolsVersion', 'VSINSTALLDIR',
              'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH', 'WindowsSdkDir',
              'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion',
              'CC', 'CXX', 'ASM')) {
            $variableValue = [Environment]::GetEnvironmentVariable($variableName, 'Process')
            if ([string]::IsNullOrWhiteSpace($variableValue) -or
                $variableValue.Contains("`r") -or $variableValue.Contains("`n")) {
              throw "Cannot publish the activated MSVC environment variable: $variableName"
            }
            "$variableName=$variableValue" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: 安装 FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache hit: $cacheHit"
          
          # Reconcile the complete product runtime: linked decoders plus the
          # ffmpeg/ffprobe tools, every software encoder exposed by Export, and
          # dynamically loaded NVIDIA NVENC/NVDEC support on capable systems.
          # Upstream asset hosts (code.videolan.org) time out occasionally;
          # retry the install because vcpkg resumes from its downloads cache.
          $install = {
            & C:\vcpkg\vcpkg.exe install 'ffmpeg[zlib,ffmpeg,ffprobe,gpl,x264,x265,aom,nvcodec]:x64-windows' --recurse --overlay-ports=vcpkg-overlay
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $install
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) {
              Write-Host "vcpkg install attempt $attempt failed; retrying after $($attempt * 20)s"
              Start-Sleep -Seconds ($attempt * 20)
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg ffmpeg install failed after 3 attempts" }
          
          $pkgConf = 'C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe'
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $pkgConf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\tools\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 诊断 FFmpeg 环境 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET"
          Write-Host "FFMPEG_DIR=$env:FFMPEG_DIR"
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      # Preserve successfully installed native dependencies even if a later
      # product test fails. Never cache a partial/failed installation.
      - name: Save installed vcpkg runtime (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Distribution package retains Noto's OFL-1.1 notices; no font is vendored.
      - name: Install and verify Linux title font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          bash scripts/validation/verify-linux-title-font.sh

      # wgpu's Auto policy can fall back to the legacy system FXC. Pin the
      # supported DXC provider for DX12 shader correctness, as with Mesa on Linux.
      # Hosted WARP is software evidence, never physical GPU qualification.
      - name: Install and verify DX12 shader compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = ./scripts/install-windows-dxc.ps1 -DestinationPath (Join-Path $env:RUNNER_TEMP 'mondrian-dxc')
          $runtime.BinDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'WGPU_DX12_COMPILER=dxc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'WGPU_BACKEND=dx12' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Keep strict GPU failures visible even if a later native driver fault
      # terminates libtest before its captured panic output can be printed.
      - name: Windows Renderer GPU regression preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          cargo test --locked -p mondrian-renderer --lib encoded_unorm16_input_matches_cpu_color_on_real_gpu -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          cargo test --locked -p mondrian-renderer --lib program_scopes_gpu::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }

      - name: 编译
        run: cargo build --workspace --exclude mondrian-app

      - name: 检查平台 Adapter
        run: cargo clippy -p mondrian-platform-core -p mondrian-platform --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace --exclude mondrian-app

      # This vendored host is a standalone workspace: the root workspace test
      # does not execute its library tests. Match the product's feature closure
      # on all three desktop runners, without requiring audio devices or GUIs.
      - name: Test vendored VST3 host contracts
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --manifest-path vendor/vst3-host/Cargo.toml --locked --no-default-features --lib -j1 -- --test-threads=1

      - name: Test actual macOS plugin main services
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo run --manifest-path vendor/vst3-host/Cargo.toml --locked --no-default-features --example macos_main_services -j1

      - name: 编译默认 App 产品入口
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build -p mondrian-app --bin mondrian -j1

      - name: 测试完整 App 产品路径
        env:
          CARGO_INCREMENTAL: "0"
        # App fixtures share the process-wide definition registry and own real
        # Runtime/deadline scopes. Isolate fixtures; their explicit worker and
        # child-process concurrency remains exercised inside each test.
        run: cargo test -p mondrian-app --all-targets -j1 -- --test-threads=1

      - name: 编译 Golden 验证入口 (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build -p mondrian-app --features validation --bin mondrian-golden -j1

  # ───────────────────────────────────────────────────────────────────────────
  # 自研 UI 产品门禁（Linux；覆盖 app UI shell、基础图形和组件极端场景）
  # ───────────────────────────────────────────────────────────────────────────
  app-ui:
    name: App UI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm libx264-dev libx265-dev libaom-dev libdav1d-dev \
            libopenjp2-7-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libass-dev libssl-dev zlib1g-dev \
            libasound2-dev libdbus-1-dev libxcb1-dev pkg-config
          ffmpeg_prefix="$RUNNER_TEMP/mondrian-ffmpeg"
          bash scripts/build-linux-ffmpeg.sh "$RUNNER_TEMP/mondrian-ffmpeg-build" "$ffmpeg_prefix" 2
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=$ffmpeg_prefix/lib${RUSTFLAGS:+ $RUSTFLAGS}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ffmpeg_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # Exercise the same shader and compositor contracts on software Vulkan.
      # Physical Metal qualification remains a separate real-machine test.
      - name: Install and verify headless Vulkan test provider
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          install -d -m 700 "$RUNNER_TEMP/mondrian-xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/mondrian-xdg-runtime"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          vulkaninfo --summary

      # Distribution package retains Noto's OFL-1.1 notices; no font is vendored.
      - name: Install and verify Linux title font
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          bash scripts/validation/verify-linux-title-font.sh

      - name: 运行完整 app 产品测试
        run: cargo test -p mondrian-app --all-targets -- --test-threads=1

      - name: 运行 app UI primitive/draw-command renderer 测试
        run: cargo test -p mondrian-ui-renderer -- --nocapture

      - name: 运行 app UI widget 极端场景测试
        run: cargo test -p mondrian-ui-widgets component_extreme_tests

  # ───────────────────────────────────────────────────────────────────────────
  # 文档构建（检测 doc comment 错误）
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev libdbus-1-dev libxcb1-dev pkg-config

      - name: 构建文档
        run: cargo doc --workspace --no-deps --exclude mondrian-app
        env:
          RUSTDOCFLAGS: "-D warnings"
