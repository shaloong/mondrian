name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ─────────────────────────────────────────────────────────────────────────────
# 缓存策略：每个 Job 独立缓存，避免交叉污染并提升命中率
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 代码格式 & 风格检查（最快，优先失败）
  # ───────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 检查格式
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────────────────────────────
  # Clippy 静态分析
  # ───────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: 运行 clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV（最低支持 Rust 版本）验证
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workspace.rust-version = 1.75
      - name: 安装 Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: 编译 workspace（验证 MSRV 兼容性）
        run: cargo build --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 依赖安全审计（license + advisories）
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 运行 cargo-deny
        run: cargo deny check bans licenses advisibilities

  # ───────────────────────────────────────────────────────────────────────────
  # 测试（Linux + Windows；macOS 逻辑与 Linux 同构，仅在 Release 验证）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      # ── Windows ───────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          # 使用 chocolatey 安装 FFmpeg（完整构建，非最小安装）
          choco install ffmpeg -y --no-progress

      - name: 编译
        run: cargo build --workspace --exclude mondrian-app

      - name: 测试
        run: cargo test --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 文档构建（检测 doc comment 错误）
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev pkg-config

      - name: 构建文档
        run: cargo doc --workspace --no-deps --exclude mondrian-app
        env:
          RUSTDOCFLAGS: "-D warnings"
