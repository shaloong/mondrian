name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ffmpeg-next 8 targets the FFmpeg 7 ABI. Bind the registry tag to its
  # immutable commit so hosted-runner or tag drift cannot select ABI 8.
  VCPKG_REF: "2025.12.12"
  VCPKG_COMMIT: "84bab45d415d22042bd0b9081aea57f362da3f35"

# ─────────────────────────────────────────────────────────────────────────────
# 缓存策略：每个 Job 独立缓存，避免交叉污染并提升命中率
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 代码格式 & 风格检查（最快，优先失败）
  # ───────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 检查格式
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────────────────────────────
  # Clippy 静态分析
  # ───────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 运行 clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV（最低支持 Rust 版本）验证
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workspace.rust-version = 1.92
      - name: 安装 Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 编译 workspace（验证 MSRV 兼容性）
        run: cargo build --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 依赖安全审计（license + advisories）
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 运行 cargo-deny
        run: cargo deny check bans licenses advisories

  # ───────────────────────────────────────────────────────────────────────────
  # 测试（Linux + Windows；macOS 逻辑与 Linux 同构，仅在 Release 验证）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      # ── Windows ───────────────────────────────────────────────────────────
      - name: 缓存 vcpkg (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ runner.os }}-vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-

      - name: 初始化 vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone --branch $env:VCPKG_REF --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          } else {
            git -C C:\vcpkg fetch --depth 1 origin "refs/tags/$env:VCPKG_REF"
            git -C C:\vcpkg checkout --detach FETCH_HEAD
          }
          $resolvedCommit = git -C C:\vcpkg rev-parse HEAD
          if ($resolvedCommit -ne $env:VCPKG_COMMIT) {
            throw "vcpkg ref resolved to $resolvedCommit, expected $env:VCPKG_COMMIT"
          }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 安装 FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache hit: $cacheHit"
          
          $ffmpegInstall = 'C:\vcpkg\installed\x64-windows\lib\pkgconfig\libavcodec.pc'
          if (Test-Path $ffmpegInstall) {
            Write-Host '✓ FFmpeg already cached and installed, skipping vcpkg install'
          } else {
            Write-Host 'Installing FFmpeg via vcpkg (no binary cache available)...'
            & C:\vcpkg\vcpkg.exe install ffmpeg:x64-windows
          }
          
          $pkgConf = 'C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe'
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $pkgConf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 诊断 FFmpeg 环境 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET"
          Write-Host "FFMPEG_DIR=$env:FFMPEG_DIR"
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          pkg-config --version
          $avcodecVersion = (pkg-config --modversion libavcodec).Trim()
          if ($LASTEXITCODE -ne 0 -or $avcodecVersion -notmatch '^61\.') {
            throw "Expected FFmpeg 7 libavcodec ABI 61, found '$avcodecVersion'"
          }
          Write-Host "libavcodec $avcodecVersion"
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 编译
        run: cargo build --workspace --exclude mondrian-app

      - name: 测试
        run: cargo test --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 文档构建（检测 doc comment 错误）
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 构建文档
        run: cargo doc --workspace --no-deps --exclude mondrian-app
        env:
          RUSTDOCFLAGS: "-D warnings"
