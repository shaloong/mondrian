name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ─────────────────────────────────────────────────────────────────────────────
# 缓存策略：每个 Job 独立缓存，避免交叉污染并提升命中率
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  reference-contracts:
    name: Reference Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Reference Corpus 与项目契约
        shell: pwsh
        run: ./scripts/validation/validate-reference-assets.ps1 -Tier Pr

      - name: 校验 Windows 参考机资格契约
        shell: pwsh
        run: ./scripts/validation/validate-windows-reference.ps1 -MachineReportPath tests/validation/fixtures/windows-machine-qualified-v3.json -RequiredMemoryClass standard-playback -RequireBaselineEligibility -OutputPath target/validation/reference-machine-contract.json

      - name: 校验 8 GiB 最低支持内存契约
        shell: pwsh
        run: ./scripts/validation/validate-windows-reference.ps1 -MachineReportPath tests/validation/fixtures/windows-machine-minimum-memory-v3.json -RequiredMemoryClass minimum-supported -OutputPath target/validation/minimum-memory-contract.json

  # ───────────────────────────────────────────────────────────────────────────
  # 代码格式 & 风格检查（最快，优先失败）
  # ───────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 检查格式
        run: cargo fmt --all -- --check

  # ───────────────────────────────────────────────────────────────────────────
  # Clippy 静态分析
  # ───────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 运行 clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV（最低支持 Rust 版本）验证
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workspace.rust-version = 1.92
      - name: 安装 Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 编译 workspace（验证 MSRV 兼容性）
        run: cargo build --workspace --exclude mondrian-app

  # ───────────────────────────────────────────────────────────────────────────
  # 依赖安全审计（license + advisories）
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: 运行 cargo-deny
        run: cargo deny check bans licenses advisories

  # ───────────────────────────────────────────────────────────────────────────
  # 测试（Windows + Linux + macOS；实机硬件资格仍由专用 Windows 门禁负责）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      # ── macOS ─────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      # ── Windows ───────────────────────────────────────────────────────────
      - name: 缓存 vcpkg (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ runner.os }}-vcpkg-ffmpeg-runtime-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-runtime-v2-
            ${{ runner.os }}-vcpkg-ffmpeg-

      - name: 初始化 vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: 安装 FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache hit: $cacheHit"
          
          # Reconcile the complete product runtime: linked decoders plus the
          # ffmpeg/ffprobe tools and every software encoder exposed by Export.
          & C:\vcpkg\vcpkg.exe install 'ffmpeg[zlib,ffmpeg,ffprobe,gpl,x264,x265,aom]:x64-windows' --recurse
          
          $pkgConf = 'C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe'
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $pkgConf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\tools\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 诊断 FFmpeg 环境 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKGRS_TRIPLET=$env:VCPKGRS_TRIPLET"
          Write-Host "FFMPEG_DIR=$env:FFMPEG_DIR"
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 编译
        run: cargo build --workspace --exclude mondrian-app

      - name: 检查平台 Adapter
        run: cargo clippy -p mondrian-platform-core -p mondrian-platform --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace --exclude mondrian-app

      - name: 测试完整 App 产品路径
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test -p mondrian-app --all-targets -j1

      - name: 编译 Golden 验证入口 (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build -p mondrian-app --features validation --bin mondrian-golden -j1

  # ───────────────────────────────────────────────────────────────────────────
  # 自研 UI 产品门禁（Linux；覆盖 app UI shell、基础图形和组件极端场景）
  # ───────────────────────────────────────────────────────────────────────────
  app-ui:
    name: App UI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 运行完整 app 产品测试
        run: cargo test -p mondrian-app --all-targets

      - name: 运行 app UI primitive/draw-command renderer 测试
        run: cargo test -p mondrian-ui-renderer

      - name: 运行 app UI widget 极端场景测试
        run: cargo test -p mondrian-ui-widgets component_extreme_tests

  # ───────────────────────────────────────────────────────────────────────────
  # 文档构建（检测 doc comment 错误）
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config

      - name: 构建文档
        run: cargo doc --workspace --no-deps --exclude mondrian-app
        env:
          RUSTDOCFLAGS: "-D warnings"
