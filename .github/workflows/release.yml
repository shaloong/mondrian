name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    # 允许手动触发进行预验证
    inputs:
      dry_run:
        description: "Dry run（不发布，仅构建）"
        required: false
        default: "false"
        type: string
      release_tag:
        description: "手动构建时用于产物命名（例如 v0.2.0-rc1），留空则使用 manual-<run_number>"
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mondrian
  # Keep the produced Mach-O deployment contract independent of runner drift.
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # 启用包级别 LTO，提升发布构建质量
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 构建矩阵：每个 Job 构建一个目标平台
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（原生）
          - label: linux-x86_64-gnu
            artifact_platform: linux
            artifact_arch: x64
            # Build on the oldest supported glibc baseline. A binary linked on
            # ubuntu-latest can silently stop launching on Ubuntu 22.04 even
            # when every non-system shared object is bundled correctly.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz

          # macOS ARM64（原生）
          - label: macos-aarch64-darwin
            artifact_platform: darwin
            artifact_arch: arm64
            # Pin the oldest standard Apple-Silicon image used by the product
            # baseline; do not let the SDK and Homebrew runtime drift via latest.
            os: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz

          # Windows x86_64（原生）
          - label: windows-x86_64-msvc
            artifact_platform: win32
            artifact_arch: x64
            # Keep the MSVC/UCRT build host stable instead of inheriting a new
            # Windows SDK whenever GitHub advances windows-latest.
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg 与系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config patchelf pax-utils

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg 与系统依赖 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config dylibbundler

      # ── Windows ────────────────────────────────────────────────────────────
      - name: 缓存 vcpkg (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ runner.os }}-vcpkg-ffmpeg-runtime-v2-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-runtime-v2-release-
            ${{ runner.os }}-vcpkg-ffmpeg-release-
            ${{ runner.os }}-vcpkg-ffmpeg-

      - name: 初始化 vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: 安装 FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache hit: $cacheHit"

          # Always reconcile the complete product runtime. A cached libavcodec.pc
          # does not prove CLI tools or Export's software encoders are present.
          & C:\vcpkg\vcpkg.exe install 'ffmpeg[zlib,ffmpeg,ffprobe,gpl,x264,x265,aom]:x64-windows' --recurse

          $pkgConf = 'C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe'
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $pkgConf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\tools\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 记录依赖版本 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustc --version
          cargo --version

          # vcpkg 在 CI 中主要提供库与 pkg-config 元数据，ffmpeg.exe 可能不存在。
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($null -ne $ffmpegCmd) {
            ffmpeg -version | Select-Object -First 1
          } else {
            Write-Host "ffmpeg CLI not found; continuing with pkg-config based validation"
          }

          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 记录依赖版本 (Unix)
        if: runner.os != 'Windows'
        run: |
          rustc --version
          cargo --version
          ffmpeg -version | head -1
          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 计算包名与路径
        id: artifact_meta
        shell: pwsh
        run: |
          $version = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $version = "${{ inputs.release_tag }}"
          } else {
            $version = "manual-${{ github.run_number }}"
          }

          $binName = "${{ env.BIN_NAME }}"
          if ("${{ runner.os }}" -eq "Windows") {
            $binPath = "target/${{ matrix.target }}/release/$binName.exe"
          } else {
            $binPath = "target/${{ matrix.target }}/release/$binName"
          }

          $packageName = "$binName-$version-${{ matrix.artifact_platform }}-${{ matrix.artifact_arch }}"
          $packagePath = "$packageName.${{ matrix.ext }}"

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIN_PATH=$binPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 构建 release 二进制
        run: |
          cargo build --release --target ${{ matrix.target }} -p mondrian-app

      - name: 验证二进制文件
        shell: pwsh
        run: |
          if (Test-Path $env:BIN_PATH) {
            $size = (Get-Item $env:BIN_PATH).Length / 1MB
            Write-Host "Binary: $env:BIN_PATH"
            Write-Host "Binary size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "Binary not found: $env:BIN_PATH"
          }

      # ── 打包 ──────────────────────────────────────────────────────────────
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD $env:PACKAGE_NAME
          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          # 将主程序与 FFmpeg 运行时 DLL 打包到同一目录，确保开箱即用。
          Copy-Item $env:BIN_PATH -Destination $stageDir -Force
          $dllSource = 'C:\vcpkg\installed\x64-windows\bin'
          $toolSource = 'C:\vcpkg\installed\x64-windows\tools\ffmpeg'
          $dlls = Get-ChildItem -Path $dllSource -Filter '*.dll' -ErrorAction Stop
          if ($dlls.Count -eq 0) {
            Write-Error "No runtime DLLs found under $dllSource"
          }

          Copy-Item -Path "$dllSource\*.dll" -Destination $stageDir -Force
          foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
            $source = Join-Path $toolSource $tool
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              Write-Error "Required packaged media tool is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $stageDir -Force
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination $stageDir -Force
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -version |
            Out-File -FilePath (Join-Path $stageDir 'MEDIA_RUNTIME_BUILD.txt') -Encoding utf8
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -buildconf |
            Out-File -FilePath (Join-Path $stageDir 'MEDIA_RUNTIME_BUILD.txt') -Encoding utf8 -Append
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -L |
            Out-File -FilePath (Join-Path $stageDir 'FFMPEG_LICENSE.txt') -Encoding utf8
          # Prove that the staged directory is self-contained. The build job
          # added vcpkg to PATH, so an ordinary invocation could accidentally
          # load a DLL omitted from the package and produce a false pass.
          $savedPath = $env:PATH
          try {
            $env:PATH = "$stageDir;$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location $stageDir
            try {
              & '.\mondrian.exe' --verify-runtime
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Packaged Windows runtime verification failed"
              }
            } finally {
              Pop-Location
            }
          } finally {
            $env:PATH = $savedPath
          }
          Compress-Archive -Path "$stageDir\*" -DestinationPath $env:PACKAGE_PATH

      - name: 打包并验证 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          stage_dir="$PACKAGE_NAME"
          mkdir -p "$stage_dir/lib"
          cp "$BIN_PATH" "$stage_dir/mondrian"
          cp -L "$(command -v ffmpeg)" "$stage_dir/ffmpeg"
          cp -L "$(command -v ffprobe)" "$stage_dir/ffprobe"
          cp LICENSE "$stage_dir/LICENSE"

          for executable in "$stage_dir/mondrian" "$stage_dir/ffmpeg" "$stage_dir/ffprobe"; do
            while IFS= read -r dependency; do
              [ -f "$dependency" ] || continue
              [ "$dependency" = "$executable" ] && continue
              name="$(basename "$dependency")"
              case "$name" in
                ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libgcc_s.so*|libstdc++.so*)
                  continue
                  ;;
              esac
              cp -L "$dependency" "$stage_dir/lib/$name"
            done < <(lddtree -l "$executable" | sort -u)
            patchelf --set-rpath '$ORIGIN/lib' "$executable"
          done

          for library in "$stage_dir"/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$library"
          done

          # `ldd` reporting no missing objects is insufficient on the build
          # host: it may silently satisfy an omitted private dependency from
          # /usr/lib. Prove that every non-baseline object in the recursive
          # closure resolves back into this staged package.
          stage_root="$(realpath "$stage_dir")"
          for executable in "$stage_dir/mondrian" "$stage_dir/ffmpeg" "$stage_dir/ffprobe"; do
            if ldd "$executable" | grep -q 'not found'; then
              ldd "$executable"
              exit 1
            fi
            while IFS= read -r dependency; do
              [ -f "$dependency" ] || continue
              resolved="$(realpath "$dependency")"
              case "$resolved" in
                "$stage_root"/*)
                  continue
                  ;;
              esac
              name="$(basename "$resolved")"
              case "$name" in
                ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libgcc_s.so*|libstdc++.so*)
                  ;;
                *)
                  echo "Packaged Linux runtime resolved a private dependency from the host: $resolved"
                  exit 1
                  ;;
              esac
            done < <(lddtree -l "$executable" | sort -u)
          done
          "$stage_dir/ffmpeg" -hide_banner -version > "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$stage_dir/ffmpeg" -hide_banner -buildconf >> "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$stage_dir/ffmpeg" -hide_banner -L > "$stage_dir/FFMPEG_LICENSE.txt"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$stage_dir/mondrian" --verify-runtime
          tar -czf "$PACKAGE_PATH" "$stage_dir"

      - name: 打包并验证 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          stage_dir="$PACKAGE_NAME"
          app_dir="$stage_dir/Mondrian.app"
          executable_dir="$app_dir/Contents/MacOS"
          frameworks_dir="$app_dir/Contents/Frameworks"
          mkdir -p "$executable_dir" "$frameworks_dir"
          cp "$BIN_PATH" "$executable_dir/mondrian"
          cp -L "$(command -v ffmpeg)" "$executable_dir/ffmpeg"
          cp -L "$(command -v ffprobe)" "$executable_dir/ffprobe"
          cp LICENSE "$stage_dir/LICENSE"
          # One invocation is required: `-od` recreates the destination, so
          # invoking it once per executable would leave only the final tool's
          # dependency closure. Multiple `-x` inputs produce the union closure.
          dylibbundler \
            -od -b \
            -x "$executable_dir/mondrian" \
            -x "$executable_dir/ffmpeg" \
            -x "$executable_dir/ffprobe" \
            -d "$frameworks_dir" \
            -p '@executable_path/../Frameworks/'
          for executable in "$executable_dir/mondrian" "$executable_dir/ffmpeg" "$executable_dir/ffprobe"; do
            if otool -L "$executable" | grep -E '/(opt/homebrew|usr/local)/'; then
              echo "Packaged macOS executable still references Homebrew libraries: $executable"
              exit 1
            fi
          done
          # Verify the complete rewritten graph, not only direct executable
          # edges. A nested Homebrew or unresolved @rpath reference can appear
          # healthy on the build host and fail on an end-user machine.
          while IFS= read -r image; do
            while IFS= read -r dependency; do
              case "$dependency" in
                /usr/lib/*|/System/Library/*)
                  ;;
                @executable_path/../Frameworks/*)
                  relative="${dependency#@executable_path/../Frameworks/}"
                  if [ ! -e "$frameworks_dir/$relative" ]; then
                    echo "Packaged macOS runtime references a missing private dylib: $dependency from $image"
                    exit 1
                  fi
                  ;;
                *)
                  echo "Packaged macOS runtime retains a non-system dependency: $dependency from $image"
                  exit 1
                  ;;
              esac
            done < <(otool -L "$image" | tail -n +2 | awk '{print $1}')
          done < <(printf '%s\n' \
            "$executable_dir/mondrian" \
            "$executable_dir/ffmpeg" \
            "$executable_dir/ffprobe"; \
            find "$frameworks_dir" -type f -print)
          "$executable_dir/ffmpeg" -hide_banner -version > "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$executable_dir/ffmpeg" -hide_banner -buildconf >> "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$executable_dir/ffmpeg" -hide_banner -L > "$stage_dir/FFMPEG_LICENSE.txt"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$executable_dir/mondrian" --verify-runtime
          tar -czf "$PACKAGE_PATH" "$stage_dir"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_meta.outputs.package_name }}
          path: ${{ steps.artifact_meta.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 发布 GitHub Release（在所有平台构建完成后执行）
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: publish / github-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: 下载所有制品
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: 列出制品
        run: ls -lh dist/

      - name: 发布 / 上传 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
