name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    # 允许手动触发进行预验证
    inputs:
      dry_run:
        description: "Dry run（不发布，仅构建）"
        required: false
        default: "false"
        type: string
      release_tag:
        description: "手动构建时用于产物命名（例如 v0.2.0-rc1），留空则使用 manual-<run_number>"
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mondrian
  # Pin the immutable vcpkg registry release so CI and Release resolve the
  # same native dependency graph instead of inheriting the registry HEAD.
  VCPKG_REF: "2026.07.29"
  # Keep the produced Mach-O deployment contract independent of runner drift.
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # 启用包级别 LTO，提升发布构建质量
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # A tag is only a name. Release authority comes from successful CI plus sealed
  # Windows reference evidence for the exact immutable source SHA.
  qualification:
    name: qualify / exact-source-commercial-engine
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      ci_run_url: ${{ steps.ci.outputs.run_url }}
      commercial_run_id: ${{ steps.commercial.outputs.run_id }}
      commercial_run_url: ${{ steps.commercial.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require successful CI for this exact source SHA
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = @(
            gh run list `
              --workflow ci.yml `
              --commit $env:GITHUB_SHA `
              --status success `
              --limit 50 `
              --json databaseId,headSha,headBranch,event,conclusion,url |
              ConvertFrom-Json
          )
          $qualified = @(
            $runs | Where-Object {
              $_.headSha -eq $env:GITHUB_SHA -and
              $_.event -eq 'push' -and
              $_.headBranch -in @('main', 'develop') -and
              $_.conclusion -eq 'success'
            }
          ) | Select-Object -First 1
          if ($null -eq $qualified) {
            throw "No successful trusted-branch CI run exists for source SHA $env:GITHUB_SHA."
          }

          "run_id=$($qualified.databaseId)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_url=$($qualified.url)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Qualified source SHA $env:GITHUB_SHA with CI run $($qualified.url)"

      - name: Require sealed Windows commercial engine evidence
        id: commercial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = @(
            gh run list `
              --workflow windows-commercial-engine.yml `
              --status success `
              --limit 100 `
              --json databaseId,headBranch,event,conclusion,url,createdAt |
              ConvertFrom-Json
          )
          $candidates = @(
            $runs | Where-Object {
              $_.event -eq 'workflow_dispatch' -and
              $_.headBranch -in @('main', 'develop') -and
              $_.conclusion -eq 'success'
            } | Sort-Object createdAt -Descending
          )
          $qualified = $null
          $evidenceDirectory = Join-Path $PWD 'target/release-commercial-evidence'
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $evidenceDirectory) {
              Remove-Item -LiteralPath $evidenceDirectory -Recurse -Force
            }
            New-Item -ItemType Directory -Path $evidenceDirectory | Out-Null
            gh run download $candidate.databaseId `
              --name "windows-commercial-engine-$env:GITHUB_SHA" `
              --dir $evidenceDirectory 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            try {
              pwsh -File scripts/validation/resolve-commercial-engine-evidence.ps1 `
                -EvidenceDirectory $evidenceDirectory `
                -ExpectedSourceSha $env:GITHUB_SHA
              if ($LASTEXITCODE -eq 0) {
                $qualified = $candidate
                break
              }
            } catch {
              Write-Warning "Rejected commercial evidence from run $($candidate.databaseId): $($_.Exception.Message)"
            }
          }
          if ($null -eq $qualified) {
            throw "No valid sealed Windows commercial engine evidence exists for source SHA $env:GITHUB_SHA."
          }

          "run_id=$($qualified.databaseId)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_url=$($qualified.url)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Qualified source SHA $env:GITHUB_SHA with Windows reference run $($qualified.url)"

  # ─────────────────────────────────────────────────────────────────────────
  # 构建矩阵：每个 Job 构建一个目标平台
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: build / ${{ matrix.label }}
    needs: qualification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the only current release target with a versioned reference
          # machine and real-device engine qualification contract. Linux/macOS
          # remain CI targets until their M4 release qualification exists.
          - label: windows-x86_64-msvc
            artifact_platform: win32
            artifact_arch: x64
            # Keep the MSVC/UCRT build host stable instead of inheriting a new
            # Windows SDK whenever GitHub advances windows-latest.
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg 与系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libasound2-dev pkg-config patchelf pax-utils

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: 安装 FFmpeg 与系统依赖 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config dylibbundler

      # ── Windows ────────────────────────────────────────────────────────────
      - name: 缓存 vcpkg (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\triplets\community
          key: ${{ runner.os }}-vcpkg-ffmpeg-runtime-v3-${{ env.VCPKG_REF }}-${{ hashFiles('Cargo.lock', 'vcpkg-overlay/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-runtime-v3-${{ env.VCPKG_REF }}-

      - name: 初始化 vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg)) {
            git clone --branch $env:VCPKG_REF --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          } else {
            git -C C:\vcpkg fetch --depth 1 origin "refs/tags/$env:VCPKG_REF"
            git -C C:\vcpkg checkout --detach FETCH_HEAD
          }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 安装 FFmpeg (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheHit = '${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache hit: $cacheHit"

          # Always reconcile the complete product runtime. A cached libavcodec.pc
          # does not prove CLI tools or Export's software encoders are present.
          $install = {
            & C:\vcpkg\vcpkg.exe install 'ffmpeg[zlib,ffmpeg,ffprobe,gpl,x264,x265,aom]:x64-windows' --recurse --overlay-ports=vcpkg-overlay
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $install
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) {
              Write-Host "vcpkg install attempt $attempt failed; retrying after $($attempt * 20)s"
              Start-Sleep -Seconds ($attempt * 20)
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg ffmpeg install failed after 3 attempts" }

          $pkgConf = 'C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe'
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_CROSS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $pkgConf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\vcpkg\installed\x64-windows\tools\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 记录依赖版本 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustc --version
          cargo --version

          # vcpkg 在 CI 中主要提供库与 pkg-config 元数据，ffmpeg.exe 可能不存在。
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($null -ne $ffmpegCmd) {
            ffmpeg -version | Select-Object -First 1
          } else {
            Write-Host "ffmpeg CLI not found; continuing with pkg-config based validation"
          }

          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 记录依赖版本 (Unix)
        if: runner.os != 'Windows'
        run: |
          rustc --version
          cargo --version
          ffmpeg -version | head -1
          pkg-config --version
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavfilter
          pkg-config --modversion libavdevice
          pkg-config --modversion libswscale
          pkg-config --modversion libswresample

      - name: 计算包名与路径
        id: artifact_meta
        shell: pwsh
        env:
          RELEASE_SOURCE_REF: ${{ github.ref }}
          RELEASE_SOURCE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_RUNNER_OS: ${{ runner.os }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BIN_NAME: ${{ env.BIN_NAME }}
          RELEASE_ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
          RELEASE_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          RELEASE_EXTENSION: ${{ matrix.ext }}
        run: |
          ./scripts/release/resolve-release-artifact.ps1 `
            -SourceRef $env:RELEASE_SOURCE_REF `
            -SourceRefName $env:RELEASE_SOURCE_REF_NAME `
            -RequestedTag $env:RELEASE_REQUESTED_TAG `
            -RunNumber ([int]$env:RELEASE_RUN_NUMBER) `
            -RunnerOs $env:RELEASE_RUNNER_OS `
            -Target $env:RELEASE_TARGET `
            -BinName $env:RELEASE_BIN_NAME `
            -ArtifactPlatform $env:RELEASE_ARTIFACT_PLATFORM `
            -ArtifactArch $env:RELEASE_ARTIFACT_ARCH `
            -Extension $env:RELEASE_EXTENSION `
            -RepositoryRoot $PWD `
            -GitHubEnvironmentPath $env:GITHUB_ENV `
            -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: 写入发行来源证明
        shell: pwsh
        run: |
          $provenance = [ordered]@{
            schema_version = 1
            repository = '${{ github.repository }}'
            source_sha = '${{ github.sha }}'
            source_ref = '${{ github.ref }}'
            trusted_ci = [ordered]@{
              run_id = '${{ needs.qualification.outputs.ci_run_id }}'
              run_url = '${{ needs.qualification.outputs.ci_run_url }}'
            }
            commercial_engine_qualification = [ordered]@{
              run_id = '${{ needs.qualification.outputs.commercial_run_id }}'
              run_url = '${{ needs.qualification.outputs.commercial_run_url }}'
              contract = 'windows-commercial-engine-v1'
            }
            release_workflow = [ordered]@{
              run_id = '${{ github.run_id }}'
              run_attempt = '${{ github.run_attempt }}'
            }
            native_dependency_registry = [ordered]@{
              vcpkg_ref = '${{ env.VCPKG_REF }}'
              overlay_sha256 = '${{ hashFiles('vcpkg-overlay/**') }}'
            }
          }
          $provenance | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath RELEASE_PROVENANCE.json -Encoding utf8

      - name: 构建 release 二进制
        run: |
          cargo build --release --target ${{ matrix.target }} -p mondrian-app

      - name: 验证二进制文件
        shell: pwsh
        run: |
          if (Test-Path $env:BIN_PATH) {
            $size = (Get-Item $env:BIN_PATH).Length / 1MB
            Write-Host "Binary: $env:BIN_PATH"
            Write-Host "Binary size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "Binary not found: $env:BIN_PATH"
          }

      # ── 打包 ──────────────────────────────────────────────────────────────
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD $env:PACKAGE_NAME
          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          # 将主程序与 FFmpeg 运行时 DLL 打包到同一目录，确保开箱即用。
          Copy-Item $env:BIN_PATH -Destination $stageDir -Force
          $dllSource = 'C:\vcpkg\installed\x64-windows\bin'
          $toolSource = 'C:\vcpkg\installed\x64-windows\tools\ffmpeg'
          $dlls = Get-ChildItem -Path $dllSource -Filter '*.dll' -ErrorAction Stop
          if ($dlls.Count -eq 0) {
            Write-Error "No runtime DLLs found under $dllSource"
          }

          Copy-Item -Path "$dllSource\*.dll" -Destination $stageDir -Force
          foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
            $source = Join-Path $toolSource $tool
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              Write-Error "Required packaged media tool is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $stageDir -Force
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination $stageDir -Force
          Copy-Item -LiteralPath 'RELEASE_PROVENANCE.json' -Destination $stageDir -Force
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -version |
            Out-File -FilePath (Join-Path $stageDir 'MEDIA_RUNTIME_BUILD.txt') -Encoding utf8
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -buildconf |
            Out-File -FilePath (Join-Path $stageDir 'MEDIA_RUNTIME_BUILD.txt') -Encoding utf8 -Append
          & (Join-Path $stageDir 'ffmpeg.exe') -hide_banner -L |
            Out-File -FilePath (Join-Path $stageDir 'FFMPEG_LICENSE.txt') -Encoding utf8
          # Prove that the staged directory is self-contained. The build job
          # added vcpkg to PATH, so an ordinary invocation could accidentally
          # load a DLL omitted from the package and produce a false pass.
          $savedPath = $env:PATH
          try {
            $env:PATH = "$stageDir;$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location $stageDir
            try {
              & '.\mondrian.exe' --verify-runtime
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Packaged Windows runtime verification failed"
              }
            } finally {
              Pop-Location
            }
          } finally {
            $env:PATH = $savedPath
          }
          Compress-Archive -Path "$stageDir\*" -DestinationPath $env:PACKAGE_PATH

      - name: 打包并验证 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          stage_dir="$PACKAGE_NAME"
          mkdir -p "$stage_dir/lib"
          cp "$BIN_PATH" "$stage_dir/mondrian"
          cp -L "$(command -v ffmpeg)" "$stage_dir/ffmpeg"
          cp -L "$(command -v ffprobe)" "$stage_dir/ffprobe"
          cp LICENSE "$stage_dir/LICENSE"
          cp RELEASE_PROVENANCE.json "$stage_dir/RELEASE_PROVENANCE.json"

          for executable in "$stage_dir/mondrian" "$stage_dir/ffmpeg" "$stage_dir/ffprobe"; do
            while IFS= read -r dependency; do
              [ -f "$dependency" ] || continue
              [ "$dependency" = "$executable" ] && continue
              name="$(basename "$dependency")"
              case "$name" in
                ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libgcc_s.so*|libstdc++.so*)
                  continue
                  ;;
              esac
              cp -L "$dependency" "$stage_dir/lib/$name"
            done < <(lddtree -l "$executable" | sort -u)
            patchelf --set-rpath '$ORIGIN/lib' "$executable"
          done

          for library in "$stage_dir"/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$library"
          done

          # `ldd` reporting no missing objects is insufficient on the build
          # host: it may silently satisfy an omitted private dependency from
          # /usr/lib. Prove that every non-baseline object in the recursive
          # closure resolves back into this staged package.
          stage_root="$(realpath "$stage_dir")"
          for executable in "$stage_dir/mondrian" "$stage_dir/ffmpeg" "$stage_dir/ffprobe"; do
            if ldd "$executable" | grep -q 'not found'; then
              ldd "$executable"
              exit 1
            fi
            while IFS= read -r dependency; do
              [ -f "$dependency" ] || continue
              resolved="$(realpath "$dependency")"
              case "$resolved" in
                "$stage_root"/*)
                  continue
                  ;;
              esac
              name="$(basename "$resolved")"
              case "$name" in
                ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libgcc_s.so*|libstdc++.so*)
                  ;;
                *)
                  echo "Packaged Linux runtime resolved a private dependency from the host: $resolved"
                  exit 1
                  ;;
              esac
            done < <(lddtree -l "$executable" | sort -u)
          done
          "$stage_dir/ffmpeg" -hide_banner -version > "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$stage_dir/ffmpeg" -hide_banner -buildconf >> "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$stage_dir/ffmpeg" -hide_banner -L > "$stage_dir/FFMPEG_LICENSE.txt"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$stage_dir/mondrian" --verify-runtime
          tar -czf "$PACKAGE_PATH" "$stage_dir"

      - name: 打包并验证 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          stage_dir="$PACKAGE_NAME"
          app_dir="$stage_dir/Mondrian.app"
          executable_dir="$app_dir/Contents/MacOS"
          frameworks_dir="$app_dir/Contents/Frameworks"
          mkdir -p "$executable_dir" "$frameworks_dir"
          cp "$BIN_PATH" "$executable_dir/mondrian"
          cp -L "$(command -v ffmpeg)" "$executable_dir/ffmpeg"
          cp -L "$(command -v ffprobe)" "$executable_dir/ffprobe"
          cp LICENSE "$stage_dir/LICENSE"
          cp RELEASE_PROVENANCE.json "$stage_dir/RELEASE_PROVENANCE.json"
          # One invocation is required: `-od` recreates the destination, so
          # invoking it once per executable would leave only the final tool's
          # dependency closure. Multiple `-x` inputs produce the union closure.
          dylibbundler \
            -od -b \
            -x "$executable_dir/mondrian" \
            -x "$executable_dir/ffmpeg" \
            -x "$executable_dir/ffprobe" \
            -d "$frameworks_dir" \
            -p '@executable_path/../Frameworks/'
          for executable in "$executable_dir/mondrian" "$executable_dir/ffmpeg" "$executable_dir/ffprobe"; do
            if otool -L "$executable" | grep -E '/(opt/homebrew|usr/local)/'; then
              echo "Packaged macOS executable still references Homebrew libraries: $executable"
              exit 1
            fi
          done
          # Verify the complete rewritten graph, not only direct executable
          # edges. A nested Homebrew or unresolved @rpath reference can appear
          # healthy on the build host and fail on an end-user machine.
          while IFS= read -r image; do
            while IFS= read -r dependency; do
              case "$dependency" in
                /usr/lib/*|/System/Library/*)
                  ;;
                @executable_path/../Frameworks/*)
                  relative="${dependency#@executable_path/../Frameworks/}"
                  if [ ! -e "$frameworks_dir/$relative" ]; then
                    echo "Packaged macOS runtime references a missing private dylib: $dependency from $image"
                    exit 1
                  fi
                  ;;
                *)
                  echo "Packaged macOS runtime retains a non-system dependency: $dependency from $image"
                  exit 1
                  ;;
              esac
            done < <(otool -L "$image" | tail -n +2 | awk '{print $1}')
          done < <(printf '%s\n' \
            "$executable_dir/mondrian" \
            "$executable_dir/ffmpeg" \
            "$executable_dir/ffprobe"; \
            find "$frameworks_dir" -type f -print)
          "$executable_dir/ffmpeg" -hide_banner -version > "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$executable_dir/ffmpeg" -hide_banner -buildconf >> "$stage_dir/MEDIA_RUNTIME_BUILD.txt"
          "$executable_dir/ffmpeg" -hide_banner -L > "$stage_dir/FFMPEG_LICENSE.txt"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$executable_dir/mondrian" --verify-runtime
          tar -czf "$PACKAGE_PATH" "$stage_dir"

      - name: 生成 Windows 候选包身份
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-Item -LiteralPath $env:PACKAGE_PATH -ErrorAction Stop
          $contractPath = 'tests/validation/windows-candidate-package.json'
          $manifestPath = "$env:PACKAGE_PATH.candidate.json"
          $manifest = [ordered]@{
            schema_version = 1
            contract = [ordered]@{
              id = 'windows-portable-candidate-v1'
              sha256 = (Get-FileHash -LiteralPath $contractPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            repository = '${{ github.repository }}'
            source_sha = '${{ github.sha }}'
            package = [ordered]@{
              file_name = $package.Name
              sha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              size_bytes = $package.Length
            }
            build = [ordered]@{
              workflow_run_id = '${{ github.run_id }}'
              workflow_run_attempt = '${{ github.run_attempt }}'
              runner_image = [string]$env:ImageOS
              runner_image_version = [string]$env:ImageVersion
            }
            status = 'built'
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath $manifestPath -Encoding utf8
          "CANDIDATE_MANIFEST_PATH=$manifestPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_meta.outputs.package_name }}
          path: |
            ${{ steps.artifact_meta.outputs.package_path }}
            ${{ env.CANDIDATE_MANIFEST_PATH }}
          if-no-files-found: error
          retention-days: 30

  # Build once, then qualify those exact immutable ZIP bytes on three independent
  # clean hosted Windows runners. Each pass verifies the manifest/hash before it
  # extracts or executes anything and retains source-bound evidence.
  candidate-package:
    name: candidate / clean-windows-${{ matrix.pass }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 下载唯一候选包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mondrian-*
          path: candidate-dist/

      - name: 验证同哈希候选包
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath candidate-dist -Recurse -File -Filter '*.zip')
          $manifests = @(Get-ChildItem -LiteralPath candidate-dist -Recurse -File -Filter '*.candidate.json')
          if ($packages.Count -ne 1 -or $manifests.Count -ne 1) {
            throw "Expected exactly one ZIP and one candidate manifest; found $($packages.Count) and $($manifests.Count)."
          }
          ./scripts/validation/verify-windows-candidate-package.ps1 `
            -PackagePath $packages[0].FullName `
            -ManifestPath $manifests[0].FullName `
            -ExpectedSourceSha '${{ github.sha }}' `
            -ExpectedRepository '${{ github.repository }}' `
            -PassIndex ${{ matrix.pass }} `
            -OutputPath 'target/validation/candidate/pass-${{ matrix.pass }}.json'

      - name: 上传候选包资格证据
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-candidate-pass-${{ matrix.pass }}-${{ github.sha }}
          path: target/validation/candidate/pass-${{ matrix.pass }}.json
          if-no-files-found: error
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # 发布 GitHub Release（在所有平台构建完成后执行）
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: publish / github-release
    needs: [build, candidate-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 下载所有制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mondrian-*
          path: dist/

      - name: 列出制品
        run: ls -lh dist/

      - name: 生成发行制品校验和
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: 发布 / 上传 Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/**/*
            SHA256SUMS
          generate_release_notes: true
          # Installation/upgrade/uninstall clean-machine qualification is still
          # open. Keep artifacts reviewable but never publicly claim commercial
          # release readiness until that candidate-package gate exists.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
