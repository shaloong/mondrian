name: Bug report
description: Report a reproducible problem in Mondrian
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Suspected security issue? Report privately using [SECURITY.md](https://github.com/shaloong/mondrian/blob/develop/.github/SECURITY.md).
        English and Chinese reports are welcome. Redact logs and paths; do not upload private media, credentials or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or exact commit; say if this is a source build.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/build, CPU/RAM, GPU/driver, and relevant runtime versions. For media problems include codec, container, resolution and frame rate.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Numbered steps and a small synthetic or redistributable sample when needed. State how often this occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include the error and sanitized logs or screenshots. A crash alone does not establish its cause.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression or workaround
      description: Last known working version, related issues, or a workaround if known.
