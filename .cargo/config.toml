[env]
# Bound ordinary CMake builds that do not pass an explicit parallel level.
CMAKE_BUILD_PARALLEL_LEVEL = { value = "1", force = false }
# OpenColorIO also invokes nested `cmake --build --parallel` commands, for which
# CMake deliberately ignores CMAKE_BUILD_PARALLEL_LEVEL. On Linux Unix Makefiles,
# use a make launcher that applies the same bound at the native tool boundary.
CMAKE_TOOLCHAIN_FILE = { value = ".cargo/cmake/linux-bounded-make.cmake", relative = true, force = false }
